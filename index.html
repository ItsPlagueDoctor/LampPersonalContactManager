<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP 4331 Contact Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            redirectIfLoggedIn();
        }, false);
    </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <!-- Title Header -->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-person-lines-fill"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">COP 4331 Contact Manager</h1>
                    <p class="text-secondary-contrast small">Your contacts, organized and searchable</p>
                </div>

                <!-- Auth Card -->
                <div id="authCard" class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">

                        <!-- Mode Switcher -->
                        <div class="auth-switcher d-flex mb-4" role="tablist">
                            <button type="button" id="showLoginTab" class="auth-tab active" onclick="setAuthMode('login');">Sign In</button>
                            <button type="button" id="showRegisterTab" class="auth-tab" onclick="setAuthMode('register');">Register</button>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
                            <div class="mb-3">
                                <label for="loginName" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="loginName" class="form-control" placeholder="Enter username" required autocomplete="username" />
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="loginPassword" class="form-label form-label-contrast small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required autocomplete="current-password" />
                                </div>
                            </div>
                            <button type="submit" id="loginButton" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <span>Sign In</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                            <div class="mt-3 text-center">
                                <span id="loginResult" class="small fw-semibold"></span>
                            </div>
                        </form>

                        <!-- Register Form -->
                        <form id="registerForm" class="d-none" onsubmit="event.preventDefault(); doRegister();">
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="registerFirstName" class="form-label form-label-contrast small">First name</label>
                                    <input type="text" id="registerFirstName" class="form-control" placeholder="First name" required />
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="registerLastName" class="form-label form-label-contrast small">Last name</label>
                                    <input type="text" id="registerLastName" class="form-control" placeholder="Last name" required />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="registerLogin" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="registerLogin" class="form-control" placeholder="Choose a username" required autocomplete="username" />
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="registerPassword" class="form-label form-label-contrast small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                    <input type="password" id="registerPassword" class="form-control" placeholder="Choose a password" required autocomplete="new-password" minlength="6" />
                                </div>
                            </div>
                            <button type="submit" id="registerButton" class="buttons btn btn-success w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <span>Create Account</span>
                                <i class="bi bi-person-plus"></i>
                            </button>
                            <div class="mt-3 text-center">
                                <span id="registerResult" class="small fw-semibold"></span>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
