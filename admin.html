<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP 4331 Contact Manager — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link href="css/styles.css" rel="stylesheet">
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            requireAdmin();
        }, false);
    </script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-11 col-lg-9">

                <!-- Header / User Bar -->
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">Admin Console</h1>
                    </div>

                    <div class="d-flex align-items-center gap-3 bg-body-tertiary px-3 py-2 rounded-pill border">
                        <span id="userName" class="small fw-medium text-body"></span>
                        <a href="contacts.html" class="btn btn-outline-info btn-sm rounded-pill px-3">
                            <i class="bi bi-people me-1"></i> My Contacts
                        </a>
                        <button type="button" id="logoutButton" class="buttons btn btn-outline-danger btn-sm rounded-pill px-3" onclick="doLogout();">
                            <i class="bi bi-box-arrow-right me-1"></i> Log Out
                        </button>
                    </div>
                </div>

                <div class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">
                        <h2 class="h5 fw-bold mb-4 d-flex align-items-center gap-2 text-white">
                            <i class="bi bi-people-fill text-primary"></i> User Management
                        </h2>

                        <!-- Search Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="userSearchText" class="form-label form-label-contrast small text-uppercase">Search Users</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="userSearchText" class="form-control" placeholder="Search by name or username" onkeyup="if(event.key === 'Enter') searchUsers();" />
                                <button type="button" class="buttons btn btn-primary px-4 fw-semibold" onclick="searchUsers();">
                                    Search
                                </button>
                            </div>
                            <div class="mt-3">
                                <span id="userSearchResult" class="text-info-wcag small fw-semibold"></span>
                                <div class="table-responsive mt-3">
                                    <table class="table table-dark table-hover align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Username</th>
                                                <th>Role</th>
                                                <th>Status</th>
                                                <th class="text-end">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="userTableBody"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Create Admin Section -->
                        <div class="section-card p-4 rounded-4 border">
                            <label class="form-label form-label-contrast small text-uppercase">Create Admin Account</label>
                            <div class="row g-2">
                                <div class="col-6 col-md-3">
                                    <input type="text" id="newAdminFirstName" class="form-control" placeholder="First name" />
                                </div>
                                <div class="col-6 col-md-3">
                                    <input type="text" id="newAdminLastName" class="form-control" placeholder="Last name" />
                                </div>
                                <div class="col-6 col-md-3">
                                    <input type="text" id="newAdminLogin" class="form-control" placeholder="Username" />
                                </div>
                                <div class="col-6 col-md-3">
                                    <input type="password" id="newAdminPassword" class="form-control" placeholder="Temporary password" />
                                </div>
                            </div>
                            <button type="button" class="buttons btn btn-success px-4 fw-semibold mt-3" onclick="createAdmin();">
                                <i class="bi bi-person-fill-add me-1"></i> Create Admin
                            </button>
                            <div class="mt-2 text-start">
                                <span id="createAdminResult" class="small fw-semibold"></span>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Reset Password Modal -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-secondary-subtle">
                    <h5 class="modal-title fw-bold">Reset Password</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="resetUserId" />
                    <p class="text-secondary-contrast small mb-3">Setting a new password for <strong id="resetUserLabel" class="text-white"></strong>.</p>
                    <label for="resetNewPassword" class="form-label form-label-contrast small">New password</label>
                    <input type="password" id="resetNewPassword" class="form-control" minlength="6" />
                    <span id="resetPasswordResult" class="small fw-semibold d-block mt-2"></span>
                </div>
                <div class="modal-footer border-secondary-subtle">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="buttons btn btn-primary fw-semibold" onclick="saveResetPassword();">Save New Password</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
