info:
  name: List all users (admin)
  type: http
  seq: 12

http:
  method: GET
  url: "{{UrlBase}}?action=listUsers"
  headers:
    - name: Authorization
      value: Bearer 1
  params:
    - name: action
      value: listUsers
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
