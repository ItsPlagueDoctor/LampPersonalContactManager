info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{UrlBase}}?action=login"
  params:
    - name: action
      value: login
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
