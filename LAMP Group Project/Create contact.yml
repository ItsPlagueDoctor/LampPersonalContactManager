info:
  name: Create contact
  type: http
  seq: 4

http:
  method: POST
  url: "{{UrlBase}}"
  headers:
    - name: Authorization
      value: Bearer  9
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Smith",
        "phone": "4075551234",
        "email": "john@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
